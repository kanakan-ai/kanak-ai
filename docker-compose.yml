services:
  postgres:
    image: postgres:16-alpine
    container_name: kanak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanak}
      POSTGRES_USER: ${POSTGRES_USER:-kanak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanak_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanak}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kanak-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kanak-minio
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: kanak-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb minio/kanak-documents --ignore-existing;
      mc anonymous set download minio/kanak-documents;
      exit 0;
      "

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: kanak-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Fixed: this is the port the process listens on INSIDE the container, which must
      # match the container-side target of the `ports:` mapping below (always 8080) and
      # the healthcheck. API_PORT only remaps the HOST side — it must not flow in here,
      # or the app starts listening on a port nothing forwards to (found via a fresh-clone
      # portability test with a customized API_PORT; see docs/M1-E2E-verification.md).
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-kanak}:${POSTGRES_PASSWORD:-kanak_dev_password}@postgres:5432/${POSTGRES_DB:-kanak}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: kanak-documents
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      AUTH_MODE: ${AUTH_MODE:-mock}
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_change_in_production}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-14}
      PARSE_PROVIDER: ${PARSE_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Only needed for temporary/assumed-role credentials (aws sts assume-role); leave
      # unset when using a long-lived IAM user access key.
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/v1}
        VITE_DOCUMENT_RETENTION_DAYS: ${VITE_DOCUMENT_RETENTION_DAYS:-14}
    container_name: kanak-web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/v1}
      VITE_DOCUMENT_RETENTION_DAYS: ${VITE_DOCUMENT_RETENTION_DAYS:-14}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
